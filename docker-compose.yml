# docker-compose — runs the full-stack web app.
#
# Next.js serves the UI and the API in one process: the Hono app is mounted
# in-process under /api. It ships an in-memory store seeded with the aLabs
# demo data, so the stack is fully usable without postgres. Point it at
# postgres by setting DATABASE_URL and swapping the repository implementation
# behind the service layer (see packages/core/src/db/schema.ts — the Drizzle
# source of truth).
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      WEB_URL: "http://localhost:3000"
      BETTER_AUTH_SECRET: "change-me"
      UPLOADS_DIR: /data/uploads
      # GOOGLE_CLIENT_ID: ...
      # GOOGLE_CLIENT_SECRET: ...
      # DATABASE_URL: postgres://alabs:alabs@postgres:5432/alabs
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/data/uploads


# docker-compose — runs api, web, and postgres.
#
# The API ships an in-memory store seeded with the aLabs demo data, so the stack
# is fully usable without postgres. Point the API at postgres by setting
# DATABASE_URL and swapping the repository implementation behind the service
# layer (see packages/core/src/db/schema.ts — the Drizzle source of truth).
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "8787"
      # DATABASE_URL: postgres://alabs:alabs@postgres:5432/alabs
    ports:
      - "8787:8787"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: "http://api:8787"
    ports:
      - "5173:5173"
    depends_on:
      - api


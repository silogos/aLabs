# docker-compose — runs the full-stack web app.
#
# Next.js serves the UI and the API in one process: the Hono app is mounted
# in-process under /api. The API currently runs against an in-memory store
# seeded with the aLabs demo data; Postgres is provisioned below so the
# Drizzle repository can be wired in by setting DATABASE_URL on `web`
# (see packages/core/src/db/schema.ts — the Drizzle source of truth).
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      WEB_URL: "http://localhost:3000"
      BETTER_AUTH_SECRET: "change-me"
      UPLOADS_DIR: /data/uploads
      DATABASE_URL: postgres://alabs:alabs@postgres:5432/alabs
      # GOOGLE_CLIENT_ID: ...
      # GOOGLE_CLIENT_SECRET: ...
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alabs
      POSTGRES_PASSWORD: alabs
      POSTGRES_DB: alabs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alabs -d alabs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
